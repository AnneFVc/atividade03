<!DOCTYPE html>
<html lang="pt-BR" ng-app="app">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atividade AngularJS - Componentes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body ng-controller="MainController as vm">

  <header class="header">
    <h1>Atividade AngularJS</h1>
    <!-- 5. Menu suspenso -->
    <dropdown-menu label="{{ vm.language.label }}" options="vm.languages" on-select="vm.changeLanguage(option)"></dropdown-menu>
  </header>

  <main class="grid">

    <!-- 1. Acordeão -->
    <section class="card">
      <h2>Perguntas Frequentes</h2>
      <accordion items="vm.faq"></accordion>
    </section>

    <!-- 4. Abas -->
    <section class="card">
      <h2>Perfil do usuário</h2>
      <tabs tabs="vm.profileTabs"></tabs>
    </section>

    <!-- 2. Paginação + filtros -->
    <section class="card wide">
      <h2>Produtos</h2>
      <input class="input" type="text" placeholder="Buscar produto..."
             ng-model="vm.search" ng-change="vm.page = 1">
      <ul class="products">
        <li ng-repeat="p in vm.filtered() | limitTo: vm.pageSize : (vm.page - 1) * vm.pageSize">
          <strong>{{ p.name | uppercase }}</strong>
          <span>{{ p.description | truncate: 40 }}</span>
          <em>{{ p.price | currency: 'R$ ' }}</em>
        </li>
        <li ng-if="!vm.filtered().length">Nenhum produto encontrado.</li>
      </ul>
      <pagination total="vm.totalPages()" current="vm.page" on-change="vm.goToPage(page)"></pagination>
    </section>

    <!-- 3. Barra de progresso -->
    <section class="card wide">
      <h2>Upload de arquivo</h2>
      <progress-bar value="vm.progress" show-label="true"></progress-bar>
      <button class="btn" ng-click="vm.startUpload()" ng-disabled="vm.uploading">Iniciar upload</button>
      <button class="btn secondary" ng-click="vm.failUpload()">Simular erro</button>
    </section>
  </main>

  <!-- 6. Toast (container exibe as notificações do serviço) -->
  <toast-container></toast-container>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
  <script src="js/services/toast.service.js"></script>
  <script src="js/services/data.service.js"></script>
  <script src="js/filters/truncate.filter.js"></script>
  <script src="js/directives/accordion.directive.js"></script>
  <script src="js/directives/pagination.directive.js"></script>
  <script src="js/directives/progress-bar.directive.js"></script>
  <script src="js/directives/tabs.directive.js"></script>
  <script src="js/directives/dropdown-menu.directive.js"></script>
  <script src="js/directives/toast-container.directive.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
